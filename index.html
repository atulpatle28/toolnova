<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolNova - Fast Image Compressor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Browser Image Compression Library -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
    <!-- Header -->
    <h1 class="text-2xl font-bold text-center mb-2 text-indigo-400">ToolNova Image Compressor</h1>
    <p class="text-sm text-slate-400 text-center mb-6">Quality loss ke bina image size kam karein</p>

    <!-- Upload Area -->
    <div id="drop-zone" class="border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 rounded-xl p-8 text-center cursor-pointer transition bg-slate-800/50">
      <input type="file" id="image-input" accept="image/*" class="hidden">
      <div class="space-y-2">
        <svg class="w-12 h-12 mx-auto text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
        <p class="text-base font-medium">Click karein ya Image yahan Drop karein</p>
        <p class="text-xs text-slate-500">JPG, PNG, WebP (Max Size: 20MB)</p>
      </div>
    </div>

    <!-- Controls & Settings -->
    <div id="controls" class="hidden mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Compression Quality: <span id="quality-val" class="text-indigo-400 font-bold">80%</span></label>
        <input type="range" id="quality-range" min="10" max="100" value="80" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
      </div>

      <button id="compress-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/30">
        Compress Image
      </button>
    </div>

    <!-- Preview & Download Area -->
    <div id="result" class="hidden mt-6 pt-6 border-t border-slate-700 space-y-4">
      <div class="grid grid-cols-2 gap-4 text-center">
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
          <p class="text-xs text-slate-400">Original Size</p>
          <p id="original-size" class="text-sm font-bold text-red-400">0 KB</p>
        </div>
        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700">
          <p class="text-xs text-slate-400">New Size</p>
          <p id="compressed-size" class="text-sm font-bold text-green-400">0 KB</p>
        </div>
      </div>

      <a id="download-btn" class="block w-full text-center bg-green-600 hover:bg-green-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-green-600/30">
        Download Compressed Image
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
